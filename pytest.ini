[pytest]
# Configuration pytest pour Kimi Proxy
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    asyncio: Test async functions
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require mocks)
    e2e: End-to-end tests (requires real MCP servers)
    filesystem: Filesystem tests
    json_query: JSON query tests

# Async configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output
addopts =
    -v
    --strict-markers
    --tb=short
    -p no:cacheprovider
